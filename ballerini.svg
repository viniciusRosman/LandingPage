<svg width="336" height="67" viewBox="0 0 336 67" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Texto com espaçamento reduzido -->
  <text x="50%" y="50%" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        text-anchor="middle" 
        alignment-baseline="middle"
        letter-spacing="-3">
    <tspan fill="#1E3A8A">R</tspan> <!-- Azul escuro -->
    <tspan fill="#065F46">o</tspan> <!-- Verde escuro -->
    <tspan fill="#6B21A8">s</tspan> <!-- Roxo fechado -->
    <tspan fill="#B45309">m</tspan> <!-- Marrom dourado -->
    <tspan fill="#374151">a</tspan> <!-- Cinza grafite -->
    <tspan fill="#0F766E">n</tspan> <!-- Verde petróleo -->
  </text>
</svg>
